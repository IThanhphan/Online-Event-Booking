openapi: 3.1.0

info:
  title: Online Event Booking API
  description: REST API for Online Event Booking & Ticketing Platform
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /api/customers:
    post:
      tags:
        - Customer
      summary: Register a customer
      description: Register a new customer account.
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '201':
          description: Customer registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'

  /api/bookings:
    post:
      tags:
        - Booking
      summary: Create a booking
      description: Reserve tickets and create a booking with PENDING status.
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Booking created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'

  /api/customers/{id}/bookings:
    get:
      tags:
        - Customer
      summary: Get customer bookings
      description: Retrieve all bookings belonging to a customer.
      operationId: getCustomerBookings
      parameters:
        - name: id
          in: path
          required: true
          description: Customer ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Customer bookings retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerBookingsResponse'

components:
  schemas:

    CustomerRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com

    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          example: nguyenvana@gmail.com

    BookingRequest:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: integer
          format: int64
          example: 1

        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BookingItemRequest'

    BookingItemRequest:
      type: object
      required:
        - ticketTypeId
        - quantity
      properties:
        ticketTypeId:
          type: integer
          format: int64
          example: 5

        quantity:
          type: integer
          minimum: 1
          example: 2

    BookingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1

        status:
          type: string
          enum:
            - PENDING
            - PAID
            - CONFIRMED
            - CANCELLED

        totalAmount:
          type: number
          example: 500000

    CustomerBookingsResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10

        reference:
          type: string
          example: BK-20260729-0001

        status:
          type: string
          enum:
            - PENDING
            - PAID
            - CONFIRMED
            - CANCELLED

        totalAmount:
          type: number
          example: 500000

        createdAt:
          type: string
          format: date-time
          example: "2026-07-29T09:30:00Z"

        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerBookingItemResponse'

    CustomerBookingItemResponse:
      type: object
      properties:
        ticketTypeId:
          type: integer
          format: int64
          example: 2

        ticketTypeName:
          type: string
          example: VIP

        quantity:
          type: integer
          example: 2

        unitPrice:
          type: number
          example: 250000